spring.application.name=techmind-api

# OCI (Oracle Cloud Infrastructure) Configuration
# Se 'oci.config-file-location' estiver definido, o SDK utilizará o arquivo ~/.oci/config (ou o caminho especificado) e a profile configurada.
oci.config-file-location=${OCI_CONFIG_FILE:}
oci.profile=${OCI_PROFILE:DEFAULT}

# Configurações de autenticação direta (caso não utilize o arquivo ~/.oci/config)
oci.tenant-id=${OCI_TENANT_ID:}
oci.user-id=${OCI_USER_ID:}
oci.fingerprint=${OCI_FINGERPRINT:}
oci.private-key-path=${OCI_PRIVATE_KEY_PATH:}
oci.region=${OCI_REGION:us-chicago-1}
oci.compartment-id=${OCI_COMPARTMENT_ID:}

# OCI Generative AI Model ID (ex: cohere.command-r-plus ou meta.llama-3.1-70b-instruct)
oci.generativeai.model-id=${OCI_GENAI_MODEL_ID:cohere.command-r-plus}
